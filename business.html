<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business — The Wed Tale</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.page{max-width:1200px;margin:auto;padding:70px 30px 100px}
.back{font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:70px;margin-top:55px}
.eyebrow{font-size:10px;letter-spacing:.16em;color:#777}
h1{font-size:clamp(55px,8vw,105px);line-height:.86;margin:18px 0}
.meta{color:#777;font-size:12px;margin:8px 0}
.description{color:#666;font-size:14px;line-height:1.8;max-width:650px;margin-top:30px}
.details{margin-top:45px;border-top:1px solid #ddd}
.detail{padding:18px 0;border-bottom:1px solid #ddd;font-size:12px}
.detail span{display:block;color:#888;font-size:9px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:6px}
.card{border:1px solid #ddd;padding:30px;position:sticky;top:25px}
.card h2{font-size:38px;margin:0 0 25px}
.field{margin-bottom:16px}
.field label{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#777;margin-bottom:7px}
.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid #ddd;padding:13px;background:#fff;font:inherit;font-size:12px;outline:none}
.field textarea{min-height:120px;resize:vertical}
.submit{width:100%;border:1px solid #111;background:#111;color:#fff;padding:14px;font-size:10px;letter-spacing:.08em;cursor:pointer}
.notice{padding:13px;border:1px solid #ddd;color:#777;font-size:11px;line-height:1.5;margin-bottom:18px}
.success{border-color:#111;color:#111}
.error{border-color:#999}
@media(max-width:800px){.layout{grid-template-columns:1fr;gap:40px}.card{position:static}.page{padding:50px 20px 80px}}
</style>
</head>
<body>

<nav class="dashboard-nav">
<a href="directory.html">← THE DIRECTORY</a>
<a href="couple-dashboard.html">ACCOUNT</a>
</nav>

<main class="page">
<a class="back" href="directory.html">← Back to directory</a>

<div id="loading" class="notice" style="margin-top:35px">Loading business…</div>

<div id="content" class="layout" style="display:none">
<section>
<p class="eyebrow" id="category"></p>
<h1 id="businessName"></h1>
<p class="meta" id="city"></p>
<p class="description" id="description"></p>

<div class="details">
<div class="detail" id="priceDetail">
<span>Price range</span>
<strong id="price"></strong>
</div>
<div class="detail" id="phoneDetail">
<span>Phone</span>
<strong id="phone"></strong>
</div>
<div class="detail" id="instagramDetail">
<span>Instagram</span>
<strong id="instagram"></strong>
</div>
<div class="detail" id="websiteDetail">
<span>Website</span>
<strong id="website"></strong>
</div>
</div>
</section>

<aside class="card">
<h2>Send an enquiry.</h2>

<div id="loginNotice" class="notice" style="display:none">
Please log in with your couple account before sending an enquiry.
</div>

<div id="formNotice" class="notice" style="display:none"></div>

<form id="enquiryForm">
<div class="field">
<label for="weddingDate">Wedding date</label>
<input id="weddingDate" type="date">
</div>

<div class="field">
<label for="location">Wedding location</label>
<input id="location" type="text" placeholder="City / venue">
</div>

<div class="field">
<label for="guestCount">Guest count</label>
<input id="guestCount" type="number" min="1" placeholder="Approximate guests">
</div>

<div class="field">
<label for="message">Message</label>
<textarea id="message" placeholder="Tell the business what you're looking for…"></textarea>
</div>

<button class="submit" type="submit">SEND ENQUIRY →</button>
</form>
</aside>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
let business = null;
let currentUser = null;

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(char) {
    return {
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[char];
  });
}

function getBusinessId() {
  return new URLSearchParams(window.location.search).get("id");
}

function showNotice(message, type) {
  const box = document.getElementById("formNotice");
  box.textContent = message;
  box.className = "notice " + (type || "");
  box.style.display = "block";
}

function setOptional(id, value, prefix) {
  const row = document.getElementById(id);
  if (!value) {
    row.style.display = "none";
    return;
  }
  document.getElementById(id.replace("Detail","")).textContent =
    prefix ? prefix + value : value;
}

async function init() {
  if (!window.supabaseClient) {
    document.getElementById("loading").textContent =
      "Supabase is not configured. Check supabase.js.";
    return;
  }

  const businessId = getBusinessId();

  if (!businessId) {
    document.getElementById("loading").textContent =
      "No business was selected.";
    return;
  }

  const { data: businessData, error } = await supabaseClient
    .from("businesses")
    .select("id,name,category,city,description,phone,instagram,website,price_range,status")
    .eq("id", businessId)
    .eq("status", "approved")
    .single();

  if (error || !businessData) {
    document.getElementById("loading").textContent =
      "This business could not be found or is not currently approved.";
    return;
  }

  business = businessData;

  document.getElementById("category").textContent =
    business.category || "WEDDING BUSINESS";
  document.getElementById("businessName").textContent = business.name;
  document.getElementById("city").textContent = business.city || "";
  document.getElementById("description").textContent =
    business.description || "A wedding business listed on The Wed Tale.";

  if (business.price_range) {
    document.getElementById("price").textContent = business.price_range;
  } else {
    document.getElementById("priceDetail").style.display = "none";
  }

  if (business.phone) {
    document.getElementById("phone").textContent = business.phone;
  } else {
    document.getElementById("phoneDetail").style.display = "none";
  }

  if (business.instagram) {
    document.getElementById("instagram").textContent = business.instagram;
  } else {
    document.getElementById("instagramDetail").style.display = "none";
  }

  if (business.website) {
    document.getElementById("website").textContent = business.website;
  } else {
    document.getElementById("websiteDetail").style.display = "none";
  }

  const { data:{ session } } = await supabaseClient.auth.getSession();

  if (session) {
    const { data:profile } = await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", session.user.id)
      .single();

    if (profile && profile.role === "couple") {
      currentUser = session.user;
    } else {
      document.getElementById("enquiryForm").style.display = "none";
      document.getElementById("loginNotice").style.display = "block";
    }
  } else {
    document.getElementById("enquiryForm").style.display = "none";
    document.getElementById("loginNotice").style.display = "block";
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("content").style.display = "grid";
}

document.getElementById("enquiryForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!currentUser || !business) {
    return;
  }

  const submitButton = this.querySelector("button");
  submitButton.disabled = true;
  submitButton.textContent = "SENDING…";

  const guestValue = document.getElementById("guestCount").value;

  const payload = {
    couple_id: currentUser.id,
    business_id: business.id,
    wedding_date: document.getElementById("weddingDate").value || null,
    location: document.getElementById("location").value.trim() || null,
    guest_count: guestValue ? Number(guestValue) : null,
    message: document.getElementById("message").value.trim() || null
  };

  const { error } = await supabaseClient
    .from("enquiries")
    .insert(payload);

  if (error) {
    showNotice("Could not send your enquiry: " + error.message, "error");
    submitButton.disabled = false;
    submitButton.textContent = "SEND ENQUIRY →";
    return;
  }
  

  showNotice(
    "Your enquiry has been sent. You can track it from your couple dashboard.",
    "success"
  );

  this.reset();
  submitButton.disabled = false;
  submitButton.textContent = "ENQUIRY SENT";
});

document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
